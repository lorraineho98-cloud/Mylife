name: flight-prices

on:
  schedule:
    - cron: "0 1 * * *"   # 每天 09:00（马来西亚时间）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch flight prices
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          IGNAV_API_KEY: ${{ secrets.IGNAV_API_KEY }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: python -P backend/flight_prices.py
      - name: Commit result
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/flights_latest.json
          git diff --staged --quiet || (git commit -m "update flight prices" && git pull --rebase && git push)
