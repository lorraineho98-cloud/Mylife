name: job-feed

on:
  schedule:
    - cron: "30 0 * * *"   # 每天 08:30（马来西亚时间）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch extra jobs
        env:
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python -P backend/job_feed.py
      - name: Commit result
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/jobs_extra.json
          git diff --staged --quiet || (git commit -m "update extra jobs" && git pull --rebase && git push)
